let G=null;
function season(w){w=w%52;return w<4?"A":w<6?"X":w<14?"O":w<20?"L":w<27?"E":w<29?"P":"O"}
function yr(){return Math.floor(G.wk/52)+1}
function has(r){return r.split(" ").every(t=>!t||(t[0]=="!"?!G.fl[t.slice(1)]:G.fl[t]))}
function fx(s,scale){const d={};s.split(" ").forEach(t=>{if(!t)return;if(t[0]=="+")G.fl[t.slice(1)]=1;else if(t[0]=="-"&&isNaN(t[1]))delete G.fl[t.slice(1)];else{const k=K["fcmb".indexOf(t[0])];let v=+t.slice(1);if(scale){const y=yr();v=Math.round(v<0?v*(1+.15*(y-1)):v*Math.max(.6,1-.05*(y-1)))}d[k]=(d[k]||0)+v}});
for(const k in d)G.S[k]=Math.max(0,Math.min(100,G.S[k]+d[k]));return d}
function fmt(d){return Object.keys(d).filter(k=>d[k]).map(k=>L[K.indexOf(k)]+" "+(d[k]>0?"+":"−")+Math.abs(d[k])).join(" · ")}
function newWeek(){const y=yr(),s=season(G.wk);let n=[];
if(G.wk%52==0&&G.wk){n.push("Year "+y+" begins.");const m=MS[y];if(m){n.push(m[0]);if(m[1])G.fl[m[1]]=1;fx(m[2])}if(y>6)n.push("Expectations keep rising.")}
if(G.wk%52==4)n.push("Christmas.");if(G.wk%52==14)n.push("Lent begins.");if(G.wk%52==20)n.push("Easter.");if(G.wk%52==27)n.push("Pentecost.");
const drain={money:1-Math.floor(y*.6)};if(y>1){const r=K[Math.floor(Math.random()*4)];drain[r]=(drain[r]||0)-Math.floor(y/2)};for(const k in drain)G.S[k]=Math.max(0,G.S[k]+drain[k]);
let pool=EV.filter(e=>(!e[1]||e[1].includes(s))&&y>=e[3]&&has(e[4])&&!G.rec.includes(e[0]));
const sea=pool.filter(e=>e[1]),cnt=y>=3?3:2+(Math.random()<.4?1:0),q=[];
if(sea.length&&Math.random()<.6)q.push(sea[Math.floor(Math.random()*sea.length)][0]);
while(q.length<cnt&&pool.length>q.length){const e=pool[Math.floor(Math.random()*pool.length)][0];if(!q.includes(e))q.push(e)}
G.q=q;G.qi=0;G.rec=G.rec.concat(q).slice(-30);G.note=n.join(" ");save()}
function save(){st.setItem("pp_save",JSON.stringify(G))}
function bar(){const y=yr();$("b1").textContent=`Week ${G.wk%52+1} · Year ${y}`;$("b2").textContent=`${SN[season(G.wk)]} · ${120+y*40+G.wk%52} parishioners`}
function hud(){$("hud").innerHTML=K.map((k,i)=>{const v=G.S[k];return`<span class="p${v<15||v>85?" w":""}">${L[i]} ${v}<i><b style="width:${v}%"></b></i></span>`}).join("")}
let cur="img/church.jpg",tm;function setImg(i){const bg=$("bg"),src="img/"+i+".jpg";if(cur==src)return;cur=src;clearTimeout(tm);bg.style.opacity=0;tm=setTimeout(()=>{bg.src=src;bg.style.opacity=1},300)}
function btns(list){$("ch").innerHTML="";list.forEach(([l,f])=>{const b=document.createElement("button");b.textContent=l;b.onclick=f;$("ch").appendChild(b)})}
function show(){$("t").classList.add("hid");$("bar").classList.remove("hid");$("hud").classList.remove("hid");
const e=EV.find(x=>x[0]==G.q[G.qi]);if(!e){G.wk++;newWeek();return show()}
bar();hud();setImg(IM[e[2]]);$("note").textContent=G.note||"";$("txt").textContent=e[5];
btns(e[6].map(c=>[c[0],()=>pick(c)]))}
function pick(c){const d=fx(c[1],1);G.note=fmt(d);G.qi++;
const dead=K.find(k=>G.S[k]<=0||G.S[k]>=100);if(dead)return over(dead);
if(G.qi>=G.q.length){G.wk++;newWeek();G.note=(fmt(d)+(G.note?"\n"+G.note:"")).trim();const d2=K.find(k=>G.S[k]<=0||G.S[k]>=100);if(d2)return over(d2)}save();show();scrollTo(0,0)}
function over(k){const hi=G.S[k]>=100,e=END[k],w=G.wk+1,y=yr();st.removeItem("pp_save");
const best=+st.getItem("pp_best")||0;if(w>best){st.setItem("pp_best",w);st.setItem("pp_lvl",y)}
G.over=1;hud();bar();setImg("church");$("note").textContent=e[0]+(hi?"":"");$("txt").textContent=`${e[hi?2:1]}\n\nYou served ${w} week${w>1?"s":""}, into Year ${y}.\nBest: ${Math.max(w,best)} week${Math.max(w,best)>1?"s":""}.`;
btns([["Start again",()=>{start();scrollTo(0,0)}],["Title",title]])}
function start(){G={S:{faith:50,community:50,money:50,bishop:50},wk:0,fl:{},q:[],qi:0,rec:[],note:""};newWeek();
G.note="You are Fr Daniel, sent to St Anne's, a struggling parish in a wet northern town. Keep all four in balance: too little or too much of anything ends your time here.";save();show()}
function title(){G=null;$("t").classList.remove("hid");$("bar").classList.add("hid");$("hud").classList.add("hid");setImg("church");$("note").textContent="";
const b=+st.getItem("pp_best")||0;$("txt").textContent=b?`Best: ${b} weeks`:"";const sv=st.getItem("pp_save"),l=[];
if(sv)l.push(["Continue",()=>{try{G=JSON.parse(sv);show()}catch(e){start()}}]);l.push(["New game",start]);btns(l)}
window.__pp={get G(){return G},choose(i){$("ch").children[i].click()},title,EV};
title();
</script></body></html>
